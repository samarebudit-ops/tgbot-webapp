<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tg bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="avatar"></div>
        <div>
          <div class="title">Tg bot</div>
          <div class="status">Online</div>
        </div>
      </div>
      <button class="iconbtn" id="menuBtn">☰</button>
    </header>

    <main class="chat glass" id="chat">
      <div class="bubble user">Привет! Что умеешь?</div>
      <div class="bubble bot">Я ИИ-бот: отвечаю текстом/голосом и распознаю изображения.</div>

      <div class="chips">
        <button class="chip fire" data-mode="voice">🎙 Голос</button>
        <button class="chip ice" data-mode="vision">🖼 Распознать</button>
        <button class="chip fire" data-mode="ask">✨ Спросить</button>
        <button class="chip ice" data-mode="settings">⚙️ Настройки</button>
      </div>
    </main>

    <footer class="composer glass">
      <button class="iconbtn">📎</button>
      <input id="q" placeholder="Напиши запрос..." />
      <button class="iconbtn" id="micBtn">🎤</button>
      <button class="send" id="sendBtn">➤</button>
    </footer>

    <nav class="tabs glass">
      <button class="tab active">💬 Чат</button>
      <button class="tab">🎤 Голос</button>
      <button class="tab">🖼 Изображение</button>
      <button class="tab">👤 Профиль</button>
    </nav>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
