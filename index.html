<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🔥❄️ Finansistic AI</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">🔥❄️ Finansistic AI</div>
    <div class="sub">WebApp чат • ИИ + картинки</div>
  </header>

  <section class="chips">
    <button class="chip" data-prompt="Составь план на 7 дней по улучшению финансов.">План</button>
    <button class="chip" data-prompt="Объясни простыми словами, как работает сложный процент.">Объясни</button>
    <button class="chip" data-prompt="Дай 5 идей заработка онлайн в 2026.">Идеи</button>
  </section>

  <main id="messages" class="messages"></main>

  <footer class="bar">
    <button id="imgBtn" class="icon">📷</button>
    <input id="input" class="input" placeholder="Напиши сообщение…"/>
    <button id="sendBtn" class="send">➤</button>
    <input id="imgFile" type="file" accept="image/*" hidden />
  </footer>

  <script src="app.js?v=1"></script>
</body>
</html>
